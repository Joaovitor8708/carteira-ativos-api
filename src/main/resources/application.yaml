spring:
  application:
    name: carteira

  datasource:
    url: jdbc:h2:mem:carteira;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # No Spring Boot 4, usando a nova dependência, fica assim:
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true

brapi:
  token: ${BRAPI_TOKEN}
  url: https://brapi.dev/api